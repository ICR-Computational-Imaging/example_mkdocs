# MkDocs configuration for the project documentation website.

site_name: Example MkDocs v0.0.1.dev0  # The name of the site
site_url: https://ICR-Computational-Imaging.github.io/RC4R/  # The URL for the static pages
repo_url: https://github.com/ICR-Computational-Imaging/RC4R  # The URL for the repository
docs_dir: docs  # The main location of the documentation files
exclude_docs: |  # Don't include these when making doc pages (relative to `docs_dir`)
  README.md

copyright: Copyright &copy; The Institute of Cancer Research  # Replace with the responsible person or organisation.
edit_uri: ""  # Keep empty to hide edit links; this does not change repository permissions.
use_directory_urls: true  # Keep enabled for clean URLs such as /guide/ instead of /guide.html.

theme:
  name: material  # Use theme from additional mkdocs-material package.
  language: en  # Replace with another supported language code if required.
  logo: assets/logo/dermapred-logo.svg  # Path is relative to docs_dir; replace with the project logo.
  favicon: assets/logo/favicon.ico  # Path is relative to docs_dir; replace with the project favicon.
  palette:
    - scheme: default  # Customize this palette to change the site's colour scheme.
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate

hooks:
  - scripts/docs_optional_figures.py  # Show placeholders until evaluation figures and metrics are available.

plugins:
  - search  # Keep enabled to provide client-side documentation search.
  - mkdocstrings:
      default_handler: python  # Use the Python handler unless a page selects another language.
      handlers:
        python:
          paths: [src]  # Import dermapred from the repository's src layout.

# Markdown features used throughout the documentation.
markdown_extensions:
  - pymdownx.highlight:  # See: https://squidfunk.github.io/mkdocs-material/reference/code-blocks/
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .  # Allows sections from any base file to be embedded in the docs.
        - docs/examples  # Replace or extend when reusable snippets are stored elsewhere.
        - .github/workflows
  - attr_list  # Enables attributes on images and other Markdown elements.
  - md_in_html  # Enables Markdown content inside HTML blocks.
  - admonition
  - pymdownx.details

# Navigation labels and their Markdown sources, relative to docs_dir.
# --8<-- [start:navigation]
nav:
  - Home: index.md  # Add an entry here whenever a new page should appear in site navigation.
  - Contributing: development_workflow.md
  - DermaPred:
      - Image inference: dermapred/inference.md
      - Desktop interface: dermapred/ui.md
      - Downloading data: dermapred/data_download.md
      - Releasing and downloading models: dermapred/model_download.md
      - Image preprocessing: dermapred/dvc/preprocessing.md
      - Model training: dermapred/dvc/train.md
      - Probability calibration: dermapred/dvc/calibration.md
      - Model provenance: dermapred/dvc/provenance.md
      - Validation performance: dermapred/dvc/validation.md
      - Final test evaluation: dermapred/dvc/evaluation.md
  - DermaPred API:
      - data.download_data: dermapred/api/data/download_data.md
      - data.preprocessing: dermapred/api/data/preprocessing.md
      - evaluation.metrics: dermapred/api/evaluation/metrics.md
      - inference.calibration: dermapred/api/inference/calibration.md
      - inference.cli: dermapred/api/inference/cli.md
      - inference.download: dermapred/api/inference/download.md
      - inference.predictor: dermapred/api/inference/predictor.md
      - models.binary_classifier: dermapred/api/models/binary_classifier.md
      - plotting.calibration: dermapred/api/plotting/calibration.md
      - plotting.evaluation: dermapred/api/plotting/evaluation.md
      - plotting.train: dermapred/api/plotting/train.md
      - ui.app: dermapred/api/ui/app.md
      - ui.images: dermapred/api/ui/images.md
  - General Tools:
      - Managing Python with uv: general/uv.md
      - Semantic versioning: general/semantic_versioning.md
      - Publishing a Python package: general/publishing_to_pypi.md
      - Managing data with DVC: general/dvc.md
      - Using Git and GitHub: general/github.md
      - Testing with pytest: general/testing.md
      - Code quality: general/code_quality.md
      - Automation with GitHub Actions: general/github_actions.md
      - Writing documentation with MkDocs: general/mkdocs.md
      - Publishing with GitHub Pages: general/github-pages.md
  
# --8<-- [end:navigation]
# Note: The --8<-- block helps mkdocs snippets identify specific blocks of content to incorporate into Markdown documentation files.
