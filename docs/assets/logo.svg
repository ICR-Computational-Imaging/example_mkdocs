<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Example MkDocs logo</title>
  <desc id="desc">An open book forming the letter M, with ivory and teal pages on an ink-blue rounded square.</desc>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#172B4D"/>
  <!-- The sloping page edges and central spine form an M. -->
  <path d="M25 34C39 33 51 38 64 48V96C51 86 39 81 25 82V34Z" fill="#F5F7FA"/>
  <path d="M103 34C89 33 77 38 64 48V96C77 86 89 81 103 82V34Z" fill="#42D6C4"/>
  <path d="M64 48V96" stroke="#172B4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- Short, gently rising lines suggest readable documentation. -->
  <path d="M36 49C42 50 47 52 52 55M36 61C42 62 47 64 52 67" stroke="#172B4D" stroke-width="4" stroke-linecap="round"/>
  <path d="M76 55C81 52 86 50 92 49M76 67C81 64 86 62 92 61" stroke="#172B4D" stroke-width="4" stroke-linecap="round"/>
</svg>
