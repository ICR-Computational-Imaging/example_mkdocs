# Preview: uv run mkdocs serve. Validate: uv run mkdocs build --strict.
site_name: Example MkDocs v0.0.1.dev1
site_url: https://ICR-Computational-Imaging.github.io/example_mkdocs/
repo_url: https://github.com/ICR-Computational-Imaging/example_mkdocs
copyright: Copyright &copy; The Institute of Cancer Research
docs_dir: docs
edit_uri: ""
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - content.code.copy
    - navigation.footer
    - toc.follow

plugins:
  - search
# --8<-- [start:mkdocstrings]
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src/example-mkdocs
          options:
            docstring_style: google
            members_order: source
            show_signature_annotations: true
# --8<-- [end:mkdocstrings]

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

# --8<-- [start:navigation]
nav:
  - Home: index.md
  - Markdown tutorials:
      - Overview: markdown/index.md
      - "1. Headings & Document Structure": markdown/headings.md
      - "2. Text Formatting": markdown/text-formatting.md
      - "3. Lists & Task Lists": markdown/lists.md
      - "4. Links & Images": markdown/links-and-images.md
      - "5. Code Blocks & Syntax Highlighting": markdown/code-blocks.md
      - "6. Tables": markdown/tables.md
      - "7. Mathematical Equations": markdown/mathematics.md
      - "8. Admonitions & Callouts": markdown/admonitions.md
      - "9. Advanced Features & MkDocs Integration": markdown/advanced.md
      - "10. API Documentation with mkdocstrings": markdown/mkdocstrings.md
  - API reference:
      - example-mkdocs: api/example-mkdocs.md
# --8<-- [end:navigation]
